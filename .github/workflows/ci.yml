name: Build
on: 
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn
      - name: ESLint Checks
        run: yarn validate:eslint
  flow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn
      - name: Flow Checks
        run: yarn validate:flow
  tsc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn
      - name: TypeScript type check
        run: yarn validate:typescript
  jest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn
      - name: Jest
        run: yarn test:jest
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn
      - name: Build Android Example App and Library
        run: cd example/android && ./gradlew clean assembleDebug
  ios:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn
      - name: Install Podfiles
        run: cd example && npx pod-install
      # Build only: `yarn ios` launches the newest simulator runtime on the
      # runner, which can be newer than the selected Xcode supports
      - name: Build example app
        run: |
          cd example/ios
          xcodebuild -workspace Example.xcworkspace -scheme Example \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Dependencies
        run: yarn
      - name: Install Podfiles
        run: cd example/macos && pod install
      - name: Build example app
        run: yarn macos --no-packager 
  windows:
    # Steps follow react-native-test-app's own Windows CI job.
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # react-native-windows defaults to requiring Visual Studio 18.6+, which
      # this runner image does not have; build with Visual Studio 2022.
      VisualStudioVersion: "17.0"
      WindowsTargetPlatformVersion: "10.0.26100.0"
    steps:
      - name: Enable long paths
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: powershell
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: microsoft/setup-msbuild@v2
      - name: Install Dependencies
        run: yarn
      - name: Generate Visual Studio solution
        run: yarn install-windows-test-app --msbuildprops WindowsTargetPlatformVersion=$env:WindowsTargetPlatformVersion
        working-directory: example
      - name: Build example app
        run: yarn windows --logging --no-packager --no-launch --no-deploy --no-telemetry --msbuildprops WindowsAppSDKVerifyTransitiveDependencies=false
        working-directory: example
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msbuild-logs
          path: example/windows/*.binlog
          retention-days: 14
